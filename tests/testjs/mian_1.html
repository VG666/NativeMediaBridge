<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.w3cbus.com/library/mdui/1.0.2/css/mdui.min.css"/>
        <script src="https://cdn.w3cbus.com/library/mdui/1.0.2/js/mdui.min.js"></script>
        <script src="js/main_1_slideshow.js"></script>
        <title>MBPython-测试js绑定py函数</title>
    </style>
    </head>
    <body  class="mdui-theme-layout-dark" style="background: #1f1d1e;">
        <div id="main" class="mdui-container">
            <div id="main-tab" class="mdui-tab mdui-tab-centered" mdui-tab>
                <a href="#example1-tab1" class="mdui-ripple">精选</a>
                <a href="#example1-tab2" class="mdui-ripple">歌手</a>
                <a href="#example1-tab3" class="mdui-ripple">排行榜</a>
            </div>
            <div id="example1-tab1"  class="mdui-p-a-2">
                <div id="slideshow">
                    <img id="slideshow_1" alt=""/>
                    <img id="slideshow_2" alt=""/>
                    <img id="slideshow_3" alt=""/>
                    <div id="slideshow_left">
                        <i class="mdui-icon material-icons" onclick="slideshow_left()"  style="position:relative;top: 16px;user-select: none;">chevron_left</i>
                    </div>
                    <div id="slideshow_right">
                        <i class="mdui-icon material-icons" onclick="slideshow_right()" style="position:relative;top: 16px;user-select: none;">chevron_right</i>
                    </div>
                    <div id="slideshow_control">
                        <i id="slideshow_control_1" class="mdui-icon material-icons" onmouseenter="slideshow_control_i(1)">fiber_manual_record</i>
                        <i id="slideshow_control_2" class="mdui-icon material-icons" onmouseenter="slideshow_control_i(2)">fiber_manual_record</i>
                        <i id="slideshow_control_3" class="mdui-icon material-icons" onmouseenter="slideshow_control_i(3)">fiber_manual_record</i>
                        <i id="slideshow_control_4" class="mdui-icon material-icons" onmouseenter="slideshow_control_i(4)">fiber_manual_record</i>
                    </div>
                </div>
                <h2>歌单推荐</h2>
                <div id="Playlist_recommended" style="background: yellow;">
                    <div class="mdui-row-xs-3 mdui-row-sm-4 mdui-row-md-5 mdui-row-lg-6 mdui-row-xl-7 mdui-grid-list">
                        <div class="mdui-col">
                            <div class="mdui-grid-tile">
                              <img src="https://cdn.w3cbus.com/mdui/docs~1/static/1ca4b7b2b4b2f2352aeb.jpg"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="example1-tab2" class="mdui-p-a-2">shopping content</div>
            <div id="example1-tab3" class="mdui-p-a-2">images content</div>
        </div>
        <style>
            * {
                margin: 0;
                padding: 0;
                -webkit-user-select: none;
                cursor:Default;
            }
            #main-tab{
                position:sticky;
                top:0%;
                left: 0%;
                transform:translate(0%,0%);
                width: 100%;
                background: #1f1d1e;
            }
            #slideshow_control{
                position:absolute;
                z-index: 5;
                left: calc(50% - 53px);
                opacity: 0;
                user-select: none;
            }
            #slideshow_control i{
                user-select: none;
                filter:brightness(0%);
            }
            #slideshow_left{
                position:absolute;
                float: left;
                opacity: 0;
                background: #1f1d1e;
                height: 60px;
            }
            #slideshow_right{
                position:absolute;
                opacity: 0;
                float: right;
                background: #1f1d1e;
                height: 60px;
                top: 0%;
            }
            #slideshow img{
                user-select: none;
                opacity:1;
            }
            #slideshow_1{
                position:relative;
                top:0.3px;
                transform:translate(0%,25%);
                height: 80%;
                width: 50%;
                -webkit-filter: brightness(0.5)
            }
            #slideshow_2{
                position:relative;
                left:17.5%;
                transform:translate(0%,-80%);
                height: 100%;
                width: 65%;
                z-index: 1;
            }
            #slideshow_3{
                position:relative;
                top:0.3px;
                left:50%;
                transform:translate(0%,-200%);
                height: 80%;
                width: 50%;
                -webkit-filter: brightness(0.5)
            }
            /*定义滚动条高宽及背景
            高宽分别对应横竖滚动条的尺寸*/
            ::-webkit-scrollbar
            {
                width:10px;
                height:100%;
                background-color:#1f1d1e;
            }
            /*定义滚动条轨道
            内阴影+圆角*/
            ::-webkit-scrollbar-track
            {
                border-radius:10px;
                background-color:#1f1d1e;
            }
            /*定义滑块
            内阴影+圆角*/
            ::-webkit-scrollbar-thumb
            {
                border-radius:10px;
                -webkit-box-shadow:inset 0 0 6px rgba(0,0,0,.3);
                background-color:#424041;
            }
        </style> 
    </body>
</html>
