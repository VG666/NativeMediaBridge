<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#87CEEB" /> <!-- 天空蓝色 -->

  <!-- 自行车底座（圆形） -->
  <circle cx="200" cy="180" r="30" fill="#8B4513" /> <!-- 车架底座 -->
  <line x1="200" y1="180" x2="200" y2="220" stroke="#000" stroke-width="4" /> <!-- 车把（垂直线） -->

  <!-- 自行车轮子（圆形） -->
  <circle cx="200" cy="220" r="25" fill="#8B4513" /> <!-- 后轮 -->
  <circle cx="200" cy="220" r="20" fill="#FFFFFF" stroke="#000" stroke-width="2" /> <!-- 前轮（白色） -->

  <!-- 海鸥（简单形状） -->
  <path d="M 120 150 
           L 140 130 
           L 160 150 
           L 180 130 
           Z" 
        fill="#F0E68C" /> <!-- 黄色身体 -->

  <!-- 海鸥头部和喙 -->
  <circle cx="130" cy="120" r="8" fill="#F0E68C" /> <!-- 头部 -->
  <path d="M 125 110 
           L 130 90 
           L 135 110 
           Z" fill="#000" /> <!-- 喙（黑色） -->

  <!-- 海鸥翅膀 -->
  <path d="M 100 150 
           L 80 120 
           L 100 90 
           Z" fill="#F0E68C" /> <!-- 左翼（黄色） -->
  <path d="M 220 150 
           L 240 120 
           L 220 90 
           Z" fill="#F0E68C" /> <!-- 右翼（黄色） -->

  <!-- 自行车座（长方形） -->
  <rect x="180" y="200" width="40" height="20" fill="#8B4513" /> <!-- 座椅 -->

  <!-- 海鸥脚部 -->
  <circle cx="185" cy="220" r="6" fill="#F0E68C" /> <!-- 左脚 -->
  <circle cx="195" cy="220" r="6" fill="#F0E68C" /> <!-- 右脚 -->

  <!-- 文字说明 -->
  <text x="50" y="280" font-size="12" fill="#000">海鸥骑自行车</text>
</svg>
